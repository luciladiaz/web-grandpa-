<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservar Turno — Grandpa Estética Vehicular</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:#f3f4f6;color:#111827;min-height:100vh;}
.hdr{background:#111827;padding:18px 24px;display:flex;align-items:center;gap:14px;}
.logo{background:#fbbf24;color:#111;font-weight:900;font-size:20px;width:48px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;}
.hdr-txt{color:white;}
.hdr-txt h1{font-size:17px;font-weight:800;}
.hdr-txt p{font-size:12px;color:#9ca3af;margin-top:1px;}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px;}
.card{background:white;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,0.08);padding:24px;margin-bottom:16px;}
.step-title{font-size:16px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.step-num{background:#fbbf24;color:#111;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;}
label{display:block;font-size:11px;font-weight:700;color:#6b7280;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.3px;}
input,select,textarea{border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;width:100%;font-size:14px;outline:none;font-family:inherit;background:white;}
input:focus,select:focus{border-color:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,0.15);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.btn-gp{background:#fbbf24;color:#111;font-weight:700;border:none;cursor:pointer;border-radius:8px;padding:12px 24px;font-size:15px;width:100%;transition:background 0.15s;}
.btn-gp:hover{background:#f59e0b;}
.btn-gp:disabled{background:#d1d5db;color:#9ca3af;cursor:not-allowed;}
.srv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.srv-btn{border:2px solid #e5e7eb;border-radius:10px;padding:12px 10px;cursor:pointer;text-align:center;background:white;transition:all 0.15s;font-family:inherit;}
.srv-btn:hover{border-color:#fbbf24;background:#fffbeb;}
.srv-btn.sel{border-color:#fbbf24;background:#fef3c7;}
.srv-btn .srv-nom{font-weight:700;font-size:13px;color:#111827;margin-bottom:4px;}
.srv-btn .srv-dias{font-size:11px;color:#6b7280;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px;}
.cal-hdr{font-size:10px;font-weight:700;text-align:center;color:#9ca3af;padding:4px 0;text-transform:uppercase;}
.cal-day{text-align:center;padding:8px 4px;border-radius:6px;font-size:13px;cursor:pointer;border:2px solid transparent;transition:all 0.15s;font-weight:600;}
.cal-day.vacio{background:transparent;cursor:default;}
.cal-day.pasado{color:#d1d5db;cursor:not-allowed;}
.cal-day.finde{color:#d1d5db;cursor:not-allowed;}
.cal-day.lleno{background:#fee2e2;color:#dc2626;cursor:not-allowed;text-decoration:line-through;}
.cal-day.disponible{background:#f0fdf4;color:#166534;border-color:#bbf7d0;}
.cal-day.disponible:hover{background:#dcfce7;border-color:#4ade80;}
.cal-day.sel{background:#fbbf24;color:#111;border-color:#f59e0b;font-weight:900;}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.cal-nav button{background:none;border:1px solid #e5e7eb;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:16px;}
.cal-nav span{font-weight:700;font-size:14px;}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;}
.b-green{background:#d1fae5;color:#065f46;}
.b-yellow{background:#fef3c7;color:#92400e;}
.aviso{background:#fef3c7;border:1px solid #fbbf24;border-radius:8px;padding:12px;font-size:13px;color:#92400e;margin-bottom:12px;}
.ok-box{text-align:center;padding:40px 20px;}
.ok-box .icon{font-size:64px;margin-bottom:16px;}
.ok-box h2{font-size:22px;font-weight:800;margin-bottom:8px;}
.ok-box p{color:#6b7280;font-size:14px;line-height:1.5;}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">GP</div>
  <div class="hdr-txt">
    <h1>Grandpa Estética Vehicular</h1>
    <p>Reservá tu turno online — sin llamadas, sin esperas</p>
  </div>
</div>

<div class="wrap">

  <!-- PASO 1: Servicio -->
  <div class="card" id="step1">
    <div class="step-title"><div class="step-num">1</div>¿Qué servicio necesitás?</div>
    <div class="srv-grid" id="srvGrid"></div>
  </div>

  <!-- PASO 2: Fecha -->
  <div class="card" id="step2" style="display:none;">
    <div class="step-title"><div class="step-num">2</div>Elegí la fecha de inicio</div>
    <div class="aviso" id="srvAviso"></div>
    <div class="cal-nav">
      <button onclick="calNav(-1)">&#8249;</button>
      <span id="calMesLabel"></span>
      <button onclick="calNav(1)">&#8250;</button>
    </div>
    <div class="cal">
      <div class="cal-hdr">LUN</div><div class="cal-hdr">MAR</div><div class="cal-hdr">MIÉ</div>
      <div class="cal-hdr">JUE</div><div class="cal-hdr">VIE</div><div class="cal-hdr">SAB</div><div class="cal-hdr">DOM</div>
    </div>
    <div class="cal" id="calDias"></div>
    <div id="fechaSelBox" style="display:none;margin-top:14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;font-size:14px;"></div>
  </div>

  <!-- PASO 3: Datos -->
  <div class="card" id="step3" style="display:none;">
    <div class="step-title"><div class="step-num">3</div>Tus datos</div>
    <div style="display:grid;gap:12px;">
      <div><label>Nombre y apellido *</label><input id="cNombre" placeholder="Ej: Juan Pérez" /></div>
      <div class="grid2">
        <div><label>Marca del auto *</label><input id="cMarca" placeholder="Ej: Toyota" /></div>
        <div><label>Modelo *</label><input id="cModelo" placeholder="Ej: Corolla" /></div>
      </div>
      <div><label>Patente *</label><input id="cPatente" placeholder="Ej: AB123CD" style="text-transform:uppercase;" /></div>
      <div><label>Celular (para confirmación por WA) *</label><input type="tel" id="cCel" placeholder="Ej: 2975123456" /></div>
    </div>
  </div>

  <!-- RESUMEN + CONFIRMAR -->
  <div class="card" id="step4" style="display:none;">
    <div class="step-title"><div class="step-num">4</div>Confirmá tu turno</div>
    <div id="resumen" style="background:#f9fafb;border-radius:8px;padding:16px;margin-bottom:16px;font-size:14px;line-height:2;"></div>
    <button class="btn-gp" id="btnConfirmar" onclick="confirmarTurno()">✅ Confirmar turno</button>
  </div>

  <!-- ÉXITO -->
  <div class="card" id="stepOk" style="display:none;">
    <div class="ok-box">
      <div class="icon">🎉</div>
      <h2>¡Turno reservado!</h2>
      <p id="okMsg"></p>
      <div style="margin-top:20px;">
        <button class="btn-gp" id="btnWA" onclick="enviarWA()" style="margin-bottom:10px;">📱 Recibir confirmación por WhatsApp</button>
        <button onclick="location.reload()" style="background:none;border:1px solid #e5e7eb;border-radius:8px;padding:10px 20px;cursor:pointer;font-size:14px;width:100%;">Reservar otro turno</button>
      </div>
    </div>
  </div>

</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "IzaSyBd1AfjVyfNpoh57o0lTnMoueMxO7ojKt4",
  authDomain: "grandpa-estetica-vehicular.firebaseapp.com",
  projectId: "grandpa-estetica-vehicular",
  storageBucket: "grandpa-estetica-vehicular.firebasestorage.app",
  messagingSenderId: "728680200386",
  appId: "1:728680200386:web:857f692ab38234d231a35b"
};

const SERVICIOS = [
  {id:'abrillantado', nom:'Abrillantado',              dias:2, color:'#3b82f6', icon:'✨'},
  {id:'ceramico_1',   nom:'Cerámico 1 año',             dias:4, color:'#f59e0b', icon:'💎'},
  {id:'ceramico_3',   nom:'Cerámico 3 años',            dias:4, color:'#f59e0b', icon:'💎'},
  {id:'ceramico_5',   nom:'Cerámico 5 años',            dias:4, color:'#f59e0b', icon:'💎'},
  {id:'tapizados',    nom:'Limpieza de tapizados',      dias:4, color:'#10b981', icon:'🧽'},
  {id:'opticas',      nom:'Restauración de ópticas',   dias:1, color:'#8b5cf6', icon:'💡'},
];

let FS = null;
let turnos = [];
let srvSel = null;
let fechaSel = null;
let calOffset = 0; // meses desde hoy
let turnoConfirmado = null;

// --- Init Firebase ---
firebase.initializeApp(FIREBASE_CONFIG);
FS = firebase.firestore();

async function init(){
  try {
    const snap = await FS.collection('gp').doc('turnos').get();
    turnos = snap.exists ? (snap.data().d || []) : [];
  } catch(e){ turnos = []; }
  renderServicios();
}

// --- Servicios ---
function renderServicios(){
  document.getElementById('srvGrid').innerHTML = SERVICIOS.map(s=>`
    <button class="srv-btn" onclick="selSrv('${s.id}')">
      <div style="font-size:24px;margin-bottom:6px;">${s.icon}</div>
      <div class="srv-nom">${s.nom}</div>
      <div class="srv-dias">${s.dias} día${s.dias>1?'s hábiles':' hábil'}</div>
    </button>`).join('');
}

function selSrv(id){
  srvSel = SERVICIOS.find(s=>s.id===id);
  fechaSel = null;
  document.querySelectorAll('.srv-btn').forEach(b=>b.classList.remove('sel'));
  event.currentTarget.classList.add('sel');
  document.getElementById('srvAviso').innerHTML =
    `<strong>${srvSel.icon} ${srvSel.nom}</strong> — Duración estimada: <strong>${srvSel.dias} día${srvSel.dias>1?'s hábiles':' hábil'}</strong>. Elegí el día de <strong>inicio</strong>.`;
  document.getElementById('step2').style.display='';
  document.getElementById('step3').style.display='none';
  document.getElementById('step4').style.display='none';
  document.getElementById('fechaSelBox').style.display='none';
  calOffset = 0;
  renderCal();
  document.getElementById('step2').scrollIntoView({behavior:'smooth',block:'start'});
}

// --- Calendario ---
function wdAdd(dateStr, n){
  if(n<=1) return dateStr;
  const d=new Date(dateStr+'T12:00:00'); let c=n-1;
  while(c>0){d.setDate(d.getDate()+1);if(d.getDay()!==0)c--;}
  return d.toISOString().split('T')[0];
}
function wdIsWorkday(ds){ const d=new Date(ds+'T12:00:00'); return d.getDay()!==0; }
function turnoEnFecha(t, ds){ return t.estado!=='cancelado'&&ds>=t.fechaInicio&&ds<=t.fechaFin; }
function getSlotsFecha(ds){ return turnos.filter(t=>turnoEnFecha(t,ds)); }
function today(){ return new Date().toISOString().split('T')[0]; }
function fmtDate(ds){ if(!ds)return''; const[y,m,d]=ds.split('-'); return`${d}/${m}/${y}`; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }

const MESES_LARGO=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function calNav(d){ calOffset+=d; if(calOffset<0)calOffset=0; renderCal(); }

function renderCal(){
  const hoy=today(); const ahora=new Date();
  const base=new Date(ahora.getFullYear(), ahora.getMonth()+calOffset, 1);
  const mes=base.getMonth(); const anio=base.getFullYear();
  document.getElementById('calMesLabel').textContent=`${MESES_LARGO[mes]} ${anio}`;
  const primerDia=new Date(anio,mes,1).getDay(); // 0=dom
  const diasMes=new Date(anio,mes+1,0).getDate();
  // Ajustar para semana lunes=0
  const offset=primerDia===0?6:primerDia-1;
  let html='';
  for(let i=0;i<offset;i++) html+=`<div class="cal-day vacio"></div>`;
  for(let d=1;d<=diasMes;d++){
    const ds=`${anio}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const esPasado=ds<hoy;
    const esFinde=!wdIsWorkday(ds);
    const slots=getSlotsFecha(ds);
    const esSel=ds===fechaSel;
    let cls='cal-day ';
    if(esSel) cls+='sel';
    else if(esPasado) cls+='pasado';
    else if(esFinde) cls+='finde';
    else if(slots.length>=2) cls+='lleno';
    else cls+='disponible';
    const clickable=!esPasado&&!esFinde&&slots.length<2;
    html+=`<div class="${cls}" ${clickable?`onclick="selFecha('${ds}')"`:''}>${d}</div>`;
  }
  document.getElementById('calDias').innerHTML=html;
}

function selFecha(ds){
  if(!srvSel) return;
  // Verificar todos los días que ocupa
  const fechaFin=wdAdd(ds,srvSel.dias);
  let d=new Date(ds+'T12:00:00'); const dEnd=new Date(fechaFin+'T12:00:00');
  let conflicto=false;
  while(d<=dEnd){
    const s=d.toISOString().split('T')[0];
    if(wdIsWorkday(s)&&getSlotsFecha(s).length>=2){conflicto=true;break;}
    d.setDate(d.getDate()+1);
  }
  if(conflicto){
    alert('No hay capacidad disponible para todos los días que necesita este servicio a partir de esa fecha. Elegí otra fecha.');
    return;
  }
  fechaSel=ds;
  renderCal();
  const box=document.getElementById('fechaSelBox');
  box.style.display='';
  box.innerHTML=`✅ <strong>${fmtDate(ds)}</strong> → Fin estimado: <strong>${fmtDate(fechaFin)}</strong> (${srvSel.dias} día${srvSel.dias>1?'s hábiles':' hábil'})`;
  document.getElementById('step3').style.display='';
  document.getElementById('step3').scrollIntoView({behavior:'smooth',block:'start'});
  actualizarResumen();
}

// --- Datos y resumen ---
function actualizarResumen(){
  if(!srvSel||!fechaSel) return;
  const fechaFin=wdAdd(fechaSel,srvSel.dias);
  const nombre=document.getElementById('cNombre').value.trim();
  const marca=document.getElementById('cMarca').value.trim();
  const modelo=document.getElementById('cModelo').value.trim();
  const patente=document.getElementById('cPatente').value.trim().toUpperCase();
  const cel=document.getElementById('cCel').value.trim();
  if(!nombre||!marca||!modelo||!patente||!cel){ document.getElementById('step4').style.display='none'; return; }
  document.getElementById('step4').style.display='';
  document.getElementById('resumen').innerHTML=`
    <div><strong>Servicio:</strong> ${srvSel.nom}</div>
    <div><strong>Inicio:</strong> ${fmtDate(fechaSel)}</div>
    <div><strong>Fin estimado:</strong> ${fmtDate(fechaFin)}</div>
    <div><strong>Cliente:</strong> ${nombre}</div>
    <div><strong>Vehículo:</strong> ${marca} ${modelo} — <code style="background:#f3f4f6;padding:2px 6px;border-radius:4px;">${patente}</code></div>
    <div><strong>Celular:</strong> ${cel}</div>`;
  document.getElementById('step4').scrollIntoView({behavior:'smooth',block:'start'});
}

['cNombre','cMarca','cModelo','cPatente','cCel'].forEach(id=>{
  document.getElementById(id)?.addEventListener('input', actualizarResumen);
});

// --- Confirmar ---
async function confirmarTurno(){
  const nombre=document.getElementById('cNombre').value.trim();
  const marca=document.getElementById('cMarca').value.trim();
  const modelo=document.getElementById('cModelo').value.trim();
  const patente=document.getElementById('cPatente').value.trim().toUpperCase();
  const cel=document.getElementById('cCel').value.trim();
  if(!nombre||!marca||!modelo||!patente||!cel){ alert('Completá todos los campos obligatorios'); return; }
  if(!srvSel||!fechaSel){ alert('Seleccioná servicio y fecha'); return; }
  const btn=document.getElementById('btnConfirmar');
  btn.disabled=true; btn.textContent='Guardando...';
  const fechaFin=wdAdd(fechaSel,srvSel.dias);
  const obj={id:uid(),servicio:srvSel.id,servicioNom:srvSel.nom,diasDuracion:srvSel.dias,
    fechaInicio:fechaSel,fechaFin,nombre,marca,modelo,patente,cel,notas:'',
    origen:'publico',estado:'confirmado',creadoEn:Date.now()};
  try {
    const snap=await FS.collection('gp').doc('turnos').get();
    const lista=snap.exists?(snap.data().d||[]):[];
    lista.push(obj);
    await FS.collection('gp').doc('turnos').set({d:lista});
    turnoConfirmado=obj;
    turnos=lista;
    // Mostrar éxito
    ['step1','step2','step3','step4'].forEach(id=>document.getElementById(id).style.display='none');
    document.getElementById('stepOk').style.display='';
    document.getElementById('okMsg').innerHTML=
      `Tu turno para <strong>${srvSel.nom}</strong> quedó registrado del <strong>${fmtDate(fechaSel)}</strong> al <strong>${fmtDate(fechaFin)}</strong>.<br><br>El equipo de Grandpa te va a estar esperando. ¡Gracias por confiar en nosotros!`;
    // Notificar al taller por WA (automático)
    notificarTaller(obj);
  } catch(e){
    alert('Hubo un error al guardar el turno. Intentá de nuevo.');
    btn.disabled=false; btn.textContent='✅ Confirmar turno';
  }
}

function notificarTaller(t){
  // Carga el número del taller desde Firebase cfg si está disponible
  FS.collection('gp').doc('cfg').get().then(snap=>{
    const cfg=snap.exists?snap.data().d:{};
    const tel=(cfg.tel||'').replace(/\D/g,'');
    if(!tel) return;
    const msg=`🔔 *Nuevo turno online — Grandpa*\n\n🔧 *Servicio:* ${t.servicioNom}\n📅 *Inicio:* ${fmtDate(t.fechaInicio)}\n📅 *Fin:* ${fmtDate(t.fechaFin)}\n👤 *Cliente:* ${t.nombre}\n🚗 *Vehículo:* ${t.marca} ${t.modelo} — ${t.patente}\n📱 *Cel:* ${t.cel}`;
    window.open('https://wa.me/549'+tel+'?text='+encodeURIComponent(msg),'_blank');
  }).catch(()=>{});
}

function enviarWA(){
  if(!turnoConfirmado) return;
  const t=turnoConfirmado;
  const msg=`¡Hola! 👋 Reservé un turno en *Grandpa Estética Vehicular*:\n\n🔧 *Servicio:* ${t.servicioNom}\n📅 *Inicio:* ${fmtDate(t.fechaInicio)}\n📅 *Fin estimado:* ${fmtDate(t.fechaFin)}\n🚗 *Vehículo:* ${t.marca} ${t.modelo} — ${t.patente}\n\n¡Los espero!`;
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

init();
</script>
</body>
</html>
